[package]
name = "adp-shell"
description = "The desktop host's window: the only crate that knows the UI toolkit (spec 030, research R2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The window, as a library that the binary runs and the tests under tests/ drive (spec 030, T088).
[lib]
name = "adp_shell"
path = "src/lib.rs"

[[bin]]
name = "adp-desktop"
path = "src/main.rs"

# Scrolling a table of 10,000 rows (spec 030, T066): the repository's benches/table.rs, a timed test with its bound.
[[test]]
name = "table"
path = "../../benches/table.rs"

# The benchmarks of SC-005, SC-006 and SC-008 and the start-up probe (spec 030, T090, research R12): the repository's
# benches/, each its own program that prints what it measured against its criterion, run with `cargo bench -p adp-shell`.
[[bench]]
name = "startup"
path = "../../benches/startup.rs"
harness = false

[[bench]]
name = "workspace"
path = "../../benches/workspace.rs"
harness = false

[[bench]]
name = "canvas"
path = "../../benches/canvas.rs"
harness = false

# SC-005 of the Hierarchical Requirement Designer (spec 036, T056, research R10): a large requirement document opened
# and changed on disk, its times printed beside the bounds the module's tests hold.
[[bench]]
name = "hierarchy"
path = "../../benches/hierarchy.rs"
harness = false

# The memory probe of SC-007 (spec 030, T091): the program left idle, its memory read; the standalone host is measured
# on the same inputs by parity/memory/standalone.mjs.
[[bench]]
name = "memory"
path = "../../benches/memory.rs"
harness = false

[lints]
workspace = true

[dependencies]
# What the add dialog offers and writes (spec 030, T068).
adp-add = { path = "../adp-add" }
adp-core = { path = "../adp-core" }
# The canvas: diagram sessions, their scenes and the layouts of what has no place of its own (spec 030, T055 to T057).
adp-cel = { path = "../adp-cel" }
adp-context = { path = "../adp-context" }
adp-diagram = { path = "../adp-diagram" }
adp-drawing = { path = "../adp-drawing" }
adp-diagram-agent-behavior-modelling = { path = "../../modules/diagrams/agent-behavior-modelling" }
adp-diagram-c4 = { path = "../../modules/diagrams/c4" }
adp-diagram-dependency-graph = { path = "../../modules/diagrams/dependency-graph" }
adp-diagram-dotnet-dependency-graph = { path = "../../modules/diagrams/dotnet-dependency-graph" }
adp-diagram-hype-cycle = { path = "../../modules/diagrams/gartner-hype-cycle-graph" }
adp-diagram-helm-chart = { path = "../../modules/diagrams/helm-chart" }
adp-diagram-sparql = { path = "../../modules/diagrams/sparql" }
adp-diagram-mindmap = { path = "../../modules/diagrams/mindmap" }
adp-diagram-timeline = { path = "../../modules/diagrams/timeline" }
adp-diagram-causal-loop = { path = "../../modules/diagrams/causal-loop-diagram" }
adp-diagram-databricks = { path = "../../modules/diagrams/databricks" }
adp-diagram-ansible-structure = { path = "../../modules/diagrams/ansible-structure" }
adp-diagram-rdf = { path = "../../modules/diagrams/rdf" }
adp-diagram-supply-chain = { path = "../../modules/diagrams/supply-chain" }
adp-diagram-azure-devops-pipeline = { path = "../../modules/diagrams/azure-devops-pipeline" }
adp-diagram-agent-activity = { path = "../../modules/diagrams/agent-activity-diagram" }
adp-diagram-sankey = { path = "../../modules/diagrams/sankey" }
adp-diagram-functional-decomposition-graph = { path = "../../modules/diagrams/functional-decomposition-graph" }
adp-diagram-wardley-map = { path = "../../modules/diagrams/wardley-map" }
# The designer tab: the Knowledge designer's session over the DESL table model (spec 030, T064, T065).
adp-designer-knowledge = { path = "../../modules/designers/knowledge" }
# The hierarchy tab: the Hierarchical Requirement Designer's session over the DESL hierarchy surface (etalii.adp spec 036, T029).
adp-designer-hierarchical-requirement = { path = "../../modules/designers/hierarchical-requirement" }
adp-desl = { path = "../adp-desl" }
adp-disl = { path = "../adp-disl" }
adp-fbl = { path = "../adp-fbl" }
adp-history = { path = "../adp-history" }
adp-layout = { path = "../adp-layout" }
adp-scene = { path = "../adp-scene" }
serde_json = { version = "1", features = ["preserve_order"] }
# A module's view mints what it adds as a ShortGuid, a version 4 GUID as 25 characters of base 36.
uuid = { version = "1", features = ["v4"] }
adp-theme = { path = "../adp-theme" }
# The window, drawn on wgpu, with AccessKit for screen readers (spec 030, research R2).
adp-documents = { path = "../adp-documents" }
adp-hierarchy = { path = "../adp-hierarchy" }
adp-problems = { path = "../adp-problems" }
adp-projects = { path = "../adp-projects" }
adp-editor-json = { path = "../../modules/editors/json" }
adp-editor-markdown = { path = "../../modules/editors/markdown" }
adp-editor-xml = { path = "../../modules/editors/xml" }
adp-editor-yaml = { path = "../../modules/editors/yaml" }
adp-text = { path = "../adp-text" }
# The `.atd` editor: its checker for the problems panel, and its language server on a worker thread (spec 035, T105).
adp-atd-check = { path = "../adp-atd-check" }
# The validation view runs a description's tool and its conformance cases (spec 035, T129).
adp-atd-runtime = { path = "../adp-atd-runtime" }
adp-atd-validate = { path = "../adp-atd-validate" }
adp-atd-lsp = { path = "../adp-atd-lsp" }
lsp-server.workspace = true
# Highlighting with TextMate grammars, which VS Code's token colours are written for (spec 030, research R6).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# The platform's own file dialogs (spec 030, research R2).
rfd = "0.15"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }

[dev-dependencies]
# The canvas tests write what a frame painted as a screenshot under target/screenshots.
png = "0.18"
# The table benchmark counts the bytes held with an instrumented system allocator.
stats_alloc = "0.1"
tempfile = "3"
# The recording painter's drawings are checked against ATD's schema (spec 035, T051).
jsonschema = { version = "0.59", default-features = false }
