[package]
name = "adp-shell"
description = "The desktop host's window: the only crate that knows the UI toolkit (spec 030, research R2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "adp-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adp-core = { path = "../adp-core" }
# The canvas: diagram sessions, their scenes and the layouts of what has no place of its own (spec 030, T055 to T057).
adp-cel = { path = "../adp-cel" }
adp-context = { path = "../adp-context" }
adp-diagram = { path = "../adp-diagram" }
adp-disl = { path = "../adp-disl" }
adp-fbl = { path = "../adp-fbl" }
adp-history = { path = "../adp-history" }
adp-layout = { path = "../adp-layout" }
adp-scene = { path = "../adp-scene" }
serde_json = { version = "1", features = ["preserve_order"] }
adp-theme = { path = "../adp-theme" }
# The window, drawn on wgpu, with AccessKit for screen readers (spec 030, research R2).
adp-documents = { path = "../adp-documents" }
adp-hierarchy = { path = "../adp-hierarchy" }
adp-problems = { path = "../adp-problems" }
adp-projects = { path = "../adp-projects" }
adp-editor-json = { path = "../../modules/editors/json" }
adp-editor-markdown = { path = "../../modules/editors/markdown" }
adp-editor-xml = { path = "../../modules/editors/xml" }
adp-editor-yaml = { path = "../../modules/editors/yaml" }
adp-text = { path = "../adp-text" }
# Highlighting with TextMate grammars, which VS Code's token colours are written for (spec 030, research R6).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# The platform's own file dialogs (spec 030, research R2).
rfd = "0.15"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }

[dev-dependencies]
tempfile = "3"
