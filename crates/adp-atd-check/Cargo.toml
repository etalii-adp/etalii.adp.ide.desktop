[package]
name = "adp-atd-check"
description = "The checker of ATD: names, imports, kinds, CEL types, settings against the schema, cross-checks and the script (spec 035, research R9, R19)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
regex = "1"
adp-atd-syntax = { path = "../adp-atd-syntax" }
# A grammar binding's grammar is built to find its conflicts (ATD8001, FBL 0.9 section 4.9).
adp-atd-grammar = { path = "../adp-atd-grammar" }
jsonschema = { version = "0.59", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
