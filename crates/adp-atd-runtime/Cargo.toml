[package]
name = "adp-atd-runtime"
description = "Lowers a checked tool description onto the engines and runs it on working copies; the capability registry (spec 035, research R14, R16)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-atd-script = { path = "../adp-atd-script" }
adp-layout = { path = "../adp-layout" }
# A layout's boxes are kept in the order they were placed.
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
