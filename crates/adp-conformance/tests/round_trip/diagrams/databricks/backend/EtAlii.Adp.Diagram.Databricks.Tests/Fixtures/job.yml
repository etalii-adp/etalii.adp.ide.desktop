resources:
  jobs:
    nightly_ingest:
      name: Nightly ingest
      job_clusters:
        - job_cluster_key: ingest_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: ingest
          job_cluster_key: ingest_cluster
          notebook_task:
            notebook_path: notebooks/ingest
        - task_key: quality_gate
          depends_on:
            - task_key: ingest
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.ingest.values.rows}}"
            right: "0"
        - task_key: publish
          depends_on:
            - task_key: quality_gate
              outcome: "true"
          notebook_task:
            notebook_path: notebooks/publish
        - task_key: alert
          run_if: AT_LEAST_ONE_FAILED
          depends_on:
            - task_key: quality_gate
              outcome: "false"
          spark_python_task:
            python_file: scripts/alert.py
        - task_key: refresh_dashboard
          depends_on:
            - task_key: publish
          sql_task:
            warehouse_id: "4b9b953939869799"
            query:
              query_id: 9d3f2b1a
