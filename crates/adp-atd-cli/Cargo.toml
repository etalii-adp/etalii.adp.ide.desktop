[package]
name = "adp-atd-cli"
description = "The `atd` command line: check, fmt, tree, tables, validate and record (spec 035, contracts/checker.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "atd"
path = "src/main.rs"

[lints]
workspace = true

# `atd record` runs the desktop host's modules (a hierarchy designer's through `adp-desl`'s session) and its canvas's
# recording painter, so it is built only with the `record` feature: the `atd` shipped into other hosts is built
# without it (spec 035, T050).
[features]
default = ["record"]
record = ["dep:adp-desl", "dep:adp-documents", "dep:adp-editor-json", "dep:adp-editor-markdown", "dep:adp-editor-xml", "dep:adp-editor-yaml", "dep:adp-diagram", "dep:adp-diagram-c4", "dep:adp-diagram-rdf", "dep:adp-diagram-mindmap", "dep:adp-parity", "dep:adp-shell", "dep:adp-theme"]

[dependencies]
adp-desl = { path = "../adp-desl", optional = true }
adp-diagram = { path = "../adp-diagram", optional = true }
adp-diagram-c4 = { path = "../../modules/diagrams/c4", optional = true }
adp-documents = { path = "../adp-documents", optional = true }
adp-editor-json = { path = "../../modules/editors/json", optional = true }
adp-editor-markdown = { path = "../../modules/editors/markdown", optional = true }
adp-editor-xml = { path = "../../modules/editors/xml", optional = true }
adp-editor-yaml = { path = "../../modules/editors/yaml", optional = true }
adp-diagram-rdf = { path = "../../modules/diagrams/rdf", optional = true }
adp-diagram-mindmap = { path = "../../modules/diagrams/mindmap", optional = true }
adp-parity = { path = "../adp-parity", optional = true }
adp-shell = { path = "../adp-shell", optional = true }
adp-theme = { path = "../adp-theme", optional = true }
adp-atd-grammar = { path = "../adp-atd-grammar" }
adp-atd-syntax = { path = "../adp-atd-syntax" }
adp-atd-check = { path = "../adp-atd-check" }
adp-atd-format = { path = "../adp-atd-format" }
adp-atd-runtime = { path = "../adp-atd-runtime" }
adp-atd-validate = { path = "../adp-atd-validate" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
tempfile = "3"
