[package]
name = "adp-disl"
description = "The DISL and DID runtime and its scenes (spec 030, FR-030)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-cel = { path = "../adp-cel" }
adp-fbl = { path = "../adp-fbl" }
indexmap = "2"
regex = "1"
serde = "1"
# A specification's members are read in the order it writes them (DISL section 2.1).
serde_json = { version = "1", features = ["preserve_order"] }
# A bundled definition's bytes are checked against the sha256 its provenance records.
sha2 = "0.10"
# The uuid-v4 and uuid-v7 id strategies (DISL section 11.5.1).
uuid = { version = "1", features = ["v4", "v7"] }

# In the WebAssembly build of the runtime (spec 035, T126) a new id's randomness comes from the JavaScript host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "v7", "js"] }

[dev-dependencies]
# The scene snapshots of the mind map's, the timeline's and the C4 container view's examples (tests/scenes, T053):
# each opened as the shell opens it, its scene built by its notation.
adp-core = { path = "../adp-core" }
adp-diagram = { path = "../adp-diagram" }
adp-diagram-c4 = { path = "../../modules/diagrams/c4" }
adp-diagram-mindmap = { path = "../../modules/diagrams/mindmap" }
adp-diagram-timeline = { path = "../../modules/diagrams/timeline" }
adp-scene = { path = "../adp-scene" }
insta = "1"
tempfile = "3"
