[package]
name = "adp-diagram"
description = "Diagram sessions: open a DISL and FBL diagram, edit it through FBL as history commands, undo, reconcile (spec 030, FR-016 to FR-018, FR-023)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-cel = { path = "../adp-cel" }
adp-context = { path = "../adp-context" }
# Without the platform's state folder, which the ATD crates built on this one do not need (deny.toml).
adp-core = { path = "../adp-core", default-features = false }
adp-disl = { path = "../adp-disl" }
adp-documents = { path = "../adp-documents" }
adp-fbl = { path = "../adp-fbl" }
adp-history = { path = "../adp-history" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
