[package]
name = "adp-core"
description = "The core's handle per window, its event channel and threads (spec 030, contracts/core-shell.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-context = { path = "../adp-context" }
# The tool-type catalogue loads the vendored specifications and their bindings (task T048).
adp-disl = { path = "../adp-disl" }
adp-fbl = { path = "../adp-fbl" }
adp-history = { path = "../adp-history" }
# The per-user state folder and its JSON files (spec 030, research R8, FR-036).
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
