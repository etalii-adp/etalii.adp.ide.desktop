[package]
name = "adp-editor-checks"
description = "The editors' checks as the runtime's check sources, for validating an editor's description (etalii.adp spec 083)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
adp-atd-runtime = { path = "../adp-atd-runtime" }
adp-editor-json = { path = "../../modules/editors/json" }
adp-editor-yaml = { path = "../../modules/editors/yaml" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
adp-editor-xml = { path = "../../modules/editors/xml" }

[dev-dependencies]
adp-atd-check = { path = "../adp-atd-check" }
adp-atd-validate = { path = "../adp-atd-validate" }

[lints]
workspace = true
