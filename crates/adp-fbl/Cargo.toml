[package]
name = "adp-fbl"
description = "FBL: families, splices, routing and the registration file (spec 030, FR-031 to FR-033)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-cel = { path = "../adp-cel" }
regex = "1"
serde = { version = "1", features = ["derive"] }
# A binding's attributes, keys and maps are read in the order the binding writes them (FBL section 3).
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
