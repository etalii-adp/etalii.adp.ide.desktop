[package]
name = "adp-atd-syntax"
description = "The table-driven parser of ATD: the lossless tree, error recovery and the abstract tree (spec 035, research R9, R10)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-atd-grammar = { path = "../adp-atd-grammar" }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
adp-atd-grammar = { path = "../adp-atd-grammar" }

[dev-dependencies]
# The highlighting test tokenizes the examples with the vendored TextMate grammar (FR-052, T097).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
jsonschema = { version = "0.59", default-features = false }
