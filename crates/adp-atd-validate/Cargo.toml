[package]
name = "adp-atd-validate"
description = "Replays conformance fixtures through the runtime and reports differences at constructs (spec 035, FR-041)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adp-atd-runtime = { path = "../adp-atd-runtime" }
adp-context = { path = "../adp-context" }
adp-diagram = { path = "../adp-diagram" }
adp-disl = { path = "../adp-disl" }
adp-history = { path = "../adp-history" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
adp-atd-check = { path = "../adp-atd-check" }
