[package]
name = "adp-diagram-rdf"
description = "The RDF family: Turtle and N-Triples read with where each triple is stated, its data-graph, OWL, SKOS and SHACL readings, and every edit as a splice (spec 030, T083)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The layouts every W3C reading is drawn by (spec 067, T040).
adp-atd-runtime = { path = "../../../crates/adp-atd-runtime" }
adp-context = { path = "../../../crates/adp-context" }
adp-diagram = { path = "../../../crates/adp-diagram" }
adp-documents = { path = "../../../crates/adp-documents" }
# Where the RDF module and the grammar family resolve an IRI (FBL 0.15 section 4.9).
adp-fbl = { path = "../../../crates/adp-fbl" }
adp-history = { path = "../../../crates/adp-history" }
adp-layout = { path = "../../../crates/adp-layout" }
# The active theme a tool's colours are chosen for (spec 030, FR-045).
adp-theme = { path = "../../../crates/adp-theme" }
# The shapes reading groups by first appearance, as the standalone host's ordered LINQ groupings do.
indexmap = "2"

[dev-dependencies]
adp-core = { path = "../../../crates/adp-core" }
adp-disl = { path = "../../../crates/adp-disl" }
tempfile = "3"

[lints]
workspace = true
