apiVersion: v2
name: scalars-as-written
description: Scalars a YAML reader types otherwise, read as the text they are written with.
version: 1.0
appVersion: 1.16
deprecated: "true"
dependencies:
  - name: quoted
    version: 1.0.0
    repository: https://example.org/charts
    condition: quoted.enabled
  - name: capital
    version: 1.0.0
    repository: https://example.org/charts
    condition: capital.enabled
  - name: yaml11
    version: 1.0.0
    repository: https://example.org/charts
    condition: yaml11.enabled
  - name: number
    version: 1.0.0
    repository: https://example.org/charts
    condition: number.enabled
