[package]
name = "adp-diagram-wardley-map"
description = "The Wardley map's residue: the .owm reader and writer, the identity sidecar and the map's axes and stages (spec 030, T070)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
adp-context = { path = "../../../crates/adp-context" }
adp-diagram = { path = "../../../crates/adp-diagram" }
adp-disl = { path = "../../../crates/adp-disl" }
adp-documents = { path = "../../../crates/adp-documents" }
adp-fbl = { path = "../../../crates/adp-fbl" }
adp-history = { path = "../../../crates/adp-history" }
# The active theme a tool's colours are chosen for (spec 030, FR-045).
adp-theme = { path = "../../../crates/adp-theme" }
# The .owm statements are read with the standalone host's expressions, look-arounds written out by hand.
regex = "1"
# The identity sidecar is read as JSON; it is written by hand, as System.Text.Json writes it.
serde_json = "1"
# A new element's id is a ShortGuid: a version 4 GUID in 25 characters of base 36.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
adp-core = { path = "../../../crates/adp-core" }
tempfile = "3"

[lints]
workspace = true
