# The nightly lakehouse bundle: one job, one pipeline, two targets.
bundle:
  name: lakehouse-nightly

include:
  - resources/*.yml

variables:
  catalog:
    description: The Unity Catalog written to.
    default: lakehouse_dev
  warehouse_id:
    default: "4b9b953939869799"

sync:
  exclude:
    - notebooks/scratch/**

resources:
  jobs:
    nightly_ingest:
      name: Nightly ingest
  pipelines:
    bronze_to_gold:
      name: Bronze to gold
  experiments:
    churn_model:
      name: /Shared/churn

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    resources:
      jobs:
        nightly_ingest:
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
