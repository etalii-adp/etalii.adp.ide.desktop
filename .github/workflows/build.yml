# Checks every pull request into develop and every change to develop (etalii.adp spec 001-ci-and-badges; spec 030, FR-040).
name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The vendored specifications and definitions must be exactly etalii.adp's at the locked commit (spec 030, research R3).
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compare vendor/etalii.adp with the locked etalii.adp commit
        run: python tools/sync-etalii-adp.py --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show
      - name: Reuse the build of earlier runs
        uses: Swatinem/rust-cache@v2
      # The layout does not depend on the OS, and on Windows `cargo fmt` passes every root file to one rustfmt call,
      # whose command line the ATD crates (spec 035) took past the 32,767-character limit (os error 206).
      - name: Format
        if: runner.os != 'Windows'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # ATD, the ADP tool language (etalii.adp spec 035, T044, T107): the `atd` the other hosts ship (built without
  # `record`) checks every vendored example and the refused corpus, the toolchain's tests run against that same
  # specification, the language server builds for WebAssembly as VS Code runs it, and what the other hosts ship carries
  # only licences compatible with Apache-2.0. A pull request whose branch etalii.adp also has is built from that
  # branch's specification (ATD_SPEC_DIR), so a construct and its checker land together.
  atd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the specification from etalii.adp's branch of this pull request's name, when there is one
        if: github.event_name == 'pull_request'
        run: |
          branch="${{ github.head_ref }}"
          if git ls-remote --exit-code --heads https://github.com/etalii-adp/etalii.adp.git "$branch" >/dev/null; then
            git clone --depth 1 --branch "$branch" https://github.com/etalii-adp/etalii.adp.git "$RUNNER_TEMP/etalii.adp"
            echo "ATD_SPEC_DIR=$RUNNER_TEMP/etalii.adp/specifications/atd" >> "$GITHUB_ENV"
          fi
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show
      - name: Reuse the build of earlier runs
        uses: Swatinem/rust-cache@v2
      - name: Build atd as the other hosts ship it, and the language server
        run: cargo build --release --no-default-features -p adp-atd-cli -p adp-atd-lsp
      - name: Record every vendored case and capability fixture again and compare them (atd record --check)
        run: cargo run --release -p adp-atd-cli -- record --check
      - name: Check every example
        run: ./target/release/atd check "${ATD_SPEC_DIR:-vendor/etalii.adp/specifications/atd}"/*.atd
      - name: Check the refused corpus against its findings
        run: ./target/release/atd check --corpus "${ATD_SPEC_DIR:-vendor/etalii.adp/specifications/atd}/refused"
      - name: Test the toolchain against that specification, the cross-check of the tables included
        run: cargo test -p adp-atd-grammar -p adp-atd-syntax -p adp-atd-check -p adp-atd-format -p adp-atd-lsp
      - name: Build the language server for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release -p adp-atd-lsp --lib --target wasm32-unknown-unknown
      - name: Check the licences of atd
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          manifest-path: crates/adp-atd-cli/Cargo.toml
          arguments: --exclude-dev --no-default-features
      - name: Check the licences of the language server
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          manifest-path: crates/adp-atd-lsp/Cargo.toml
          arguments: --exclude-dev

  # The desktop host for each platform, built from every change to develop (spec 030, FR-040, task T036). Unsigned
  # until signing is set up (T092): the release says so.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [vendor, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show
      - name: Reuse the build of earlier runs
        uses: Swatinem/rust-cache@v2
      - name: Build the release
        run: cargo build --release -p adp-shell
      - name: Pack it
        shell: bash
        run: |
          mkdir -p package
          cp LICENSE README.md package/
          # The tool types the program loads at start: the vendored specifications, definitions and bindings.
          mkdir -p package/vendor
          cp -r vendor/etalii.adp vendor/etalii.adp.ide.standalone package/vendor/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/adp-desktop.exe package/
            7z a "adp-desktop-${{ matrix.platform }}.zip" ./package/*
          else
            cp target/release/adp-desktop package/
            tar -czf "adp-desktop-${{ matrix.platform }}.tar.gz" -C package .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: adp-desktop-${{ matrix.platform }}
          path: adp-desktop-${{ matrix.platform }}.*
          if-no-files-found: error

  # Publishes the packages as a pre-release on GitHub, once per commit, only from the tip of develop.
  release:
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Compute the version
        id: version
        run: |
          base=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "version=$base-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Skip a superseded or already released commit
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/develop | cut -f1)
          released=$(git ls-remote --tags origin | grep "^${{ github.sha }}" || true)
          if [ "$tip" != "${{ github.sha }}" ] || [ -n "$released" ]; then
            echo "::notice::${{ github.sha }} is not the tip of develop, or is already released; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7
        if: steps.tip.outputs.publish == 'true'
        with:
          path: packages
          merge-multiple: true
      - name: Publish the pre-release
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" packages/* --target "${{ github.sha }}" --prerelease             --title "ADP desktop host $version"             --notes "A development build of ${{ github.sha }}, unpacked and run as it is: the programs are not signed yet, so Windows SmartScreen and macOS Gatekeeper warn before they start. Built from etalii.adp spec 030."

  # Flags a retired use of the ADP vocabulary (etalii.adp spec 002, FR-017). The runner and its list of retired
  # patterns and allowances live in etalii.adp and are read from its develop branch, so every repository is checked
  # against the same list.
  terminology:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the vocabulary against the glossary
        env:
          SOURCE: https://raw.githubusercontent.com/etalii-adp/etalii.adp/develop
        run: |
          curl -fsSL "$SOURCE/.github/scripts/terminology-check.py" -o "$RUNNER_TEMP/terminology-check.py"
          python "$RUNNER_TEMP/terminology-check.py" --name "${{ github.event.repository.name }}" --config "$SOURCE/docs/terminology-check.json"
