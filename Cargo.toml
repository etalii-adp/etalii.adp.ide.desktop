# The desktop host's workspace (etalii.adp spec 030-desktop-native-rust, plan "Project Structure").
[workspace]
resolver = "3"
members = [
    "crates/adp-add",
    "crates/adp-core",
    "crates/adp-projects",
    "crates/adp-hierarchy",
    "crates/adp-documents",
    "crates/adp-history",
    "crates/adp-context",
    "crates/adp-problems",
    "crates/adp-layout",
    "crates/adp-libxml2",
    "crates/adp-fbl",
    "crates/adp-disl",
    "crates/adp-scene",
    "crates/adp-diagram",
    "crates/adp-drawing",
    "crates/adp-desl",
    "crates/adp-cel",
    "crates/adp-theme",
    "crates/adp-text",
    "crates/adp-conformance",
    "crates/adp-parity",
    "crates/adp-shell",
    "crates/adp-atd-grammar",
    "crates/adp-atd-syntax",
    "crates/adp-atd-check",
    "crates/adp-atd-format",
    "crates/adp-atd-script",
    "crates/adp-atd-runtime",
    "crates/adp-atd-validate",
    "crates/adp-atd-lsp",
    "crates/adp-atd-cli",
    "modules/designers/hierarchical-requirement",
    "modules/designers/knowledge",
    "modules/diagrams/agent-behavior-modelling",
    "modules/diagrams/ansible-structure",
    "modules/diagrams/agent-activity-diagram",
    "modules/diagrams/c4",
    "modules/diagrams/causal-loop-diagram",
    "modules/diagrams/databricks",
    "modules/diagrams/dependency-graph",
    "modules/diagrams/dotnet-dependency-graph",
    "modules/diagrams/functional-decomposition-graph",
    "modules/diagrams/gartner-hype-cycle-graph",
    "modules/diagrams/helm-chart",
    "modules/diagrams/mindmap",
    "modules/diagrams/rdf",
    "modules/diagrams/supply-chain",
    "modules/diagrams/azure-devops-pipeline",
    "modules/diagrams/sankey",
    "modules/diagrams/sparql",
    "modules/diagrams/timeline",
    "modules/diagrams/wardley-map",
    "modules/editors/json",
    "modules/editors/markdown",
    "modules/editors/xml",
    "modules/editors/yaml",
]

# Shared by the ATD language server's crates (etalii.adp spec 035, research R9): the protocol's types, the stdio and
# in-memory transport, and the WebAssembly build.
[workspace.dependencies]
lsp-server = "0.7"
wasm-bindgen = "0.2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/etalii-adp/etalii.adp.ide.desktop"

# Principle VI: no clippy warnings. CI runs clippy with -D warnings; a lint that does not fit is allowed here, with its reason.
[workspace.lints.rust]
# Denied everywhere but in adp-libxml2, the one crate that calls C (libxml2, plan Complexity Tracking): its own lint
# table allows it, and is otherwise this one.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The layouts run optimised in debug builds too: a canvas laid out by the unoptimised force layout lags, and its at-size
# test holds a pass to a multiple of a reference workload timed beside it, which only means something when both are
# compiled alike (adp-layout `tests/tiered_force_layout.rs`).
[profile.dev.package.adp-layout]
opt-level = 3

# ATD's grammar is built by etalii-lark the first time a description is parsed: unoptimised that takes some 20
# seconds, longer than a language client waits for the server's first answer (spec 035, T165), so it is optimised in
# debug builds too, as in release it takes some 2.
[profile.dev.package.etalii-lark]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.indexmap]
opt-level = 3

